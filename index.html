<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPR Cell — Career Point University, Kota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#132241; --navy-2:#1c3059; --gold:#b6892f; --gold-soft:#e7d6ab;
  --cream:#f6f3ec; --ink:#1a1a1a; --line:#d9d3c4; --card:#ffffff; --muted:#6b6558;
  --danger:#8a2a2a;
  --sans:'Inter',system-ui,sans-serif; --serif:'Lora',Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--cream:#0f1522;--card:#161f33;--ink:#eee9db;--line:#2a3550;--muted:#a3a08f;--gold-soft:#3a3220}
}
:root[data-theme="dark"]{--cream:#0f1522;--card:#161f33;--ink:#eee9db;--line:#2a3550;--muted:#a3a08f;--gold-soft:#3a3220}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:var(--serif)}
a{color:inherit}
.hidden{display:none !important}

/* ---- seal mark ---- */
.seal{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:14px;color:var(--gold);flex:0 0 auto;background:var(--navy)}

/* ---- auth screen ---- */
#auth-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:32px 28px}
.auth-head{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.auth-head h1{font-size:19px;margin:0;line-height:1.25}
.auth-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px}
input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:4px;background:var(--cream);color:var(--ink);font:inherit;font-size:14.5px}
input:focus{outline:2px solid var(--navy-2);outline-offset:1px}
.btn{margin-top:20px;width:100%;padding:11px;border:none;border-radius:4px;background:var(--navy);color:#fff;font:inherit;font-size:14.5px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold);color:#221a05}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--navy-2);border:1px solid var(--line)}
:root[data-theme="dark"] .btn.ghost{color:var(--gold-soft)}
.switch-row{margin-top:16px;font-size:13px;text-align:center;color:var(--muted)}
.switch-row button{background:none;border:none;color:var(--gold);cursor:pointer;font:inherit;padding:0}
.msg{margin-top:14px;font-size:12.5px;padding:9px 10px;border-radius:4px;display:none}
.msg.show{display:block}
.msg.err{background:#f4dede;color:var(--danger)}
:root[data-theme="dark"] .msg.err{background:#3a1a1a}
.msg.ok{background:var(--gold-soft);color:#4a3a10}
:root[data-theme="dark"] .msg.ok{color:#e7d6ab}

/* ---- app shell ---- */
#app-view{min-height:100vh;display:flex}
.sidebar{width:250px;flex:0 0 auto;background:var(--navy);color:#e9e4d6;padding:20px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{display:flex;gap:10px;align-items:center;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.14)}
.sidebar .brand h2{font-size:14.5px;margin:0;line-height:1.3}
.sidebar .brand span{display:block;font-size:11px;color:#b7ac86;margin-top:2px}
.cat-btn{display:block;width:100%;text-align:left;background:none;border:none;color:#d8d2bd;font:inherit;font-size:13.5px;padding:9px 10px;border-radius:4px;cursor:pointer;margin-bottom:2px}
.cat-btn:hover{background:rgba(255,255,255,.06)}
.cat-btn.active{background:var(--gold);color:#221a05;font-weight:500}
.sidebar-foot{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.who{font-size:12px;color:#b7ac86;margin-bottom:10px;line-height:1.4}

.main{flex:1;min-width:0;padding:28px 34px;max-width:880px}
.main h1{font-size:23px;margin:0 0 4px}
.main .sub{color:var(--muted);font-size:13px;margin:0 0 22px}
.resource{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:14px}
.resource h3{margin:0 0 6px;font-size:16px}
.resource .meta{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.resource .body{font-size:14px;line-height:1.65;white-space:pre-wrap}
.empty{color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:6px;padding:22px;text-align:center}
.add-box{background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:18px 20px;margin-bottom:20px}
.add-box h3{margin:0 0 12px;font-size:14.5px}
textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:4px;background:var(--cream);color:var(--ink);font:inherit;font-size:14px;min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1;min-width:160px}
.top-actions{display:flex;justify-content:flex-end;margin-bottom:10px}
@media (max-width:720px){
  #app-view{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static}
  .main{padding:20px 18px}
}
</style>
</head>
<body>

<!-- ============ AUTH VIEW ============ -->
<div id="auth-view">
  <div class="auth-card">
    <div class="auth-head">
      <div class="seal">IPR</div>
      <div>
        <h1>IPR Cell</h1>
        <p>Career Point University, Kota</p>
      </div>
    </div>

    <div id="login-form">
      <label for="li-email">Email</label>
      <input id="li-email" type="email" autocomplete="email" placeholder="you@cpu.ac.in">
      <label for="li-pass">Password</label>
      <input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" id="login-btn">Sign in</button>
      <div class="switch-row">New here? <button id="show-signup">Create an account</button></div>
    </div>

    <div id="signup-form" class="hidden">
      <label for="su-name">Full name</label>
      <input id="su-name" type="text" placeholder="Your name">
      <label for="su-email">Email</label>
      <input id="su-email" type="email" autocomplete="email" placeholder="you@cpu.ac.in">
      <label for="su-pass">Password</label>
      <input id="su-pass" type="password" autocomplete="new-password" placeholder="At least 6 characters">
      <button class="btn gold" id="signup-btn">Create account</button>
      <div class="switch-row">Already registered? <button id="show-login">Sign in</button></div>
    </div>

    <div class="msg" id="auth-msg"></div>
  </div>
</div>

<!-- ============ APP VIEW ============ -->
<div id="app-view" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="seal">IPR</div>
      <div>
        <h2>IPR Cell</h2>
        <span>Career Point University, Kota</span>
      </div>
    </div>
    <nav id="cat-nav"></nav>
    <div class="sidebar-foot">
      <div class="who" id="who-box"></div>
      <button class="btn ghost" id="logout-btn" style="margin-top:0">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="top-actions"></div>
    <h1 id="cat-title">Overview</h1>
    <p class="sub" id="cat-sub"></p>
    <div id="add-box-slot"></div>
    <div id="resource-list"></div>
  </main>
</div>

<script>
/* ============================================================
   1) SUPABASE PROJECT CONFIG — replace with your own project's
      values (Project Settings → API in the Supabase dashboard).
   ============================================================ */
const SUPABASE_URL = "https://hcgkfzojgrnabkgrruhs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_limfkr_mETSrLlKOvCv8Yw_Tjb5f8st";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORIES = [
  {key:"overview", label:"Overview", desc:"What the IPR Cell does and how it helps students, faculty and researchers protect their work."},
  {key:"patents", label:"Patents", desc:"Protecting inventions — process, forms and CPU's filing support."},
  {key:"trademarks", label:"Trademarks", desc:"Protecting names, logos and brand identifiers."},
  {key:"copyrights", label:"Copyrights", desc:"Protecting original literary, software and creative works."},
  {key:"designs", label:"Industrial Designs", desc:"Protecting the visual design of products."},
  {key:"trade_secrets", label:"Trade Secrets", desc:"Protecting confidential business and research information."},
  {key:"gi", label:"Geographical Indications", desc:"Protecting products tied to a geographic origin."},
  {key:"policy", label:"IPR Policy & Forms", desc:"University IPR policy, disclosure forms and contacts."}
];

let currentUser = null, currentProfile = null, currentCat = "overview";

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
function showMsg(text, ok){
  const m = $("auth-msg");
  m.textContent = text;
  m.className = "msg show " + (ok ? "ok" : "err");
}

/* ---------- auth form toggling ---------- */
$("show-signup").onclick = () => { $("login-form").classList.add("hidden"); $("signup-form").classList.remove("hidden"); $("auth-msg").className="msg"; };
$("show-login").onclick = () => { $("signup-form").classList.add("hidden"); $("login-form").classList.remove("hidden"); $("auth-msg").className="msg"; };

$("login-btn").onclick = async () => {
  const email = $("li-email").value.trim(), password = $("li-pass").value;
  if(!email || !password) return showMsg("Enter your email and password.", false);
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) showMsg(error.message, false); else showMsg("Signed in.", true);
};

$("signup-btn").onclick = async () => {
  const full_name = $("su-name").value.trim(), email = $("su-email").value.trim(), password = $("su-pass").value;
  if(!full_name || !email || !password) return showMsg("Fill in every field.", false);
  if(password.length < 6) return showMsg("Password must be at least 6 characters.", false);
  const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name } } });
  if(error) return showMsg(error.message, false);
  showMsg("Account created. Check your email to confirm, then sign in.", true);
};

$("logout-btn").onclick = async () => { await sb.auth.signOut(); };

/* ---------- profile + role ---------- */
async function loadProfile(user){
  let { data, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(!data && !error?.message?.includes("permission")){
    const ins = await sb.from("profiles").insert({ id:user.id, full_name:user.user_metadata?.full_name||user.email, role:"member" }).select().single();
    data = ins.data;
  }
  return data || { full_name:user.email, role:"member" };
}

/* ---------- nav / categories ---------- */
function renderNav(){
  const nav = $("cat-nav");
  nav.innerHTML = "";
  CATEGORIES.forEach(c => {
    const b = document.createElement("button");
    b.className = "cat-btn" + (c.key===currentCat ? " active" : "");
    b.textContent = c.label;
    b.onclick = () => { currentCat = c.key; renderNav(); loadCategory(); };
    nav.appendChild(b);
  });
}

async function loadCategory(){
  const cat = CATEGORIES.find(c=>c.key===currentCat);
  $("cat-title").textContent = cat.label;
  $("cat-sub").textContent = cat.desc;

  const addSlot = $("add-box-slot");
  addSlot.innerHTML = "";
  if(currentProfile.role === "admin" && cat.key !== "overview"){
    addSlot.innerHTML = `
      <div class="add-box">
        <h3>Add a resource to ${cat.label}</h3>
        <input id="new-title" type="text" placeholder="Title" style="margin-bottom:10px">
        <textarea id="new-body" placeholder="Content — guidance, steps, links, contact details…"></textarea>
        <button class="btn gold" id="save-res" style="max-width:200px">Publish resource</button>
      </div>`;
    $("save-res").onclick = async () => {
      const title = $("new-title").value.trim(), content = $("new-body").value.trim();
      if(!title || !content) return;
      const { error } = await sb.from("resources").insert({ category:cat.key, title, content, created_by:currentUser.id });
      if(!error){ $("new-title").value=""; $("new-body").value=""; loadCategory(); }
    };
  }

  const list = $("resource-list");
  list.innerHTML = "<p class='empty'>Loading…</p>";

  if(cat.key === "overview"){
    list.innerHTML = `<div class="resource">
      <h3>Welcome</h3>
      <div class="body">The IPR Cell at Career Point University, Kota supports students, researchers and faculty through every stage of protecting original work — from a first invention disclosure to a filed patent, trademark or copyright. Use the categories on the left to browse guidance for each type of intellectual property, or reach out to the Cell directly for one-to-one support.</div>
    </div>`;
    return;
  }

  const { data, error } = await sb.from("resources").select("*").eq("category", cat.key).order("created_at", { ascending:false });
  if(error){ list.innerHTML = `<p class="empty">Could not load resources — ${error.message}</p>`; return; }
  if(!data || data.length===0){ list.innerHTML = "<p class='empty'>Nothing published in this category yet.</p>"; return; }

  list.innerHTML = "";
  data.forEach(r => {
    const el = document.createElement("div");
    el.className = "resource";
    const date = new Date(r.created_at).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    el.innerHTML = `<h3></h3><div class="meta">Published ${date}</div><div class="body"></div>`;
    el.querySelector("h3").textContent = r.title;
    el.querySelector(".body").textContent = r.content;
    list.appendChild(el);
  });
}

/* ---------- auth state ---------- */
sb.auth.onAuthStateChange(async (_event, session) => {
  if(session?.user){
    currentUser = session.user;
    currentProfile = await loadProfile(currentUser);
    $("auth-view").classList.add("hidden");
    $("app-view").classList.remove("hidden");
    $("who-box").innerHTML = `Signed in as<br><strong>${currentProfile.full_name}</strong><br>${currentProfile.role === "admin" ? "Cell administrator" : "Member"}`;
    currentCat = "overview";
    renderNav();
    loadCategory();
  } else {
    currentUser = null; currentProfile = null;
    $("app-view").classList.add("hidden");
    $("auth-view").classList.remove("hidden");
  }
});
</script>
</body>
</html>
