<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPR Cell — Career Point University, Kota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#0f1c36; --navy-2:#1c3059; --gold:#b6892f; --gold-soft:#e7d6ab; --forest:#3b5943;
  --cream:#f7f4ec; --ink:#1c1a15; --line:#ddd6c3; --card:#ffffff; --muted:#726c5c; --danger:#8a2a2a;
  --sans:'Inter',system-ui,sans-serif; --serif:'Lora',Georgia,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--cream:#0c1220;--card:#151f34;--ink:#efe9da;--line:#2a3550;--muted:#a19c89;--gold-soft:#3a3220}
}
:root[data-theme="dark"]{--cream:#0c1220;--card:#151f34;--ink:#efe9da;--line:#2a3550;--muted:#a19c89;--gold-soft:#3a3220}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.serif{font-family:var(--serif);font-weight:600;margin:0}
a{color:inherit}
.hidden{display:none !important}
::selection{background:var(--gold-soft)}

.seal{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--gold);flex:0 0 auto;background:var(--navy);letter-spacing:.5px}

#auth-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:
  radial-gradient(circle at 15% 20%, rgba(182,137,47,.08), transparent 45%),
  radial-gradient(circle at 85% 80%, rgba(28,48,89,.10), transparent 45%), var(--cream)}
.auth-card{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:34px 30px;box-shadow:0 18px 40px -20px rgba(15,28,54,.25);animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.auth-head{display:flex;gap:12px;align-items:center;margin-bottom:24px}
.auth-head h1{font-size:20px;line-height:1.25}
.auth-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--cream);color:var(--ink);font:inherit;font-size:14.5px;transition:border-color .15s}
input:focus{outline:none;border-color:var(--gold)}
.btn{margin-top:20px;width:100%;padding:11px;border:none;border-radius:5px;background:var(--navy);color:#fff;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.2)}
.btn.gold{background:var(--gold);color:#221a05}
.btn.ghost{background:transparent;color:var(--navy-2);border:1px solid var(--line);font-weight:500}
:root[data-theme="dark"] .btn.ghost{color:var(--gold-soft)}
.switch-row{margin-top:16px;font-size:13px;text-align:center;color:var(--muted)}
.switch-row button{background:none;border:none;color:var(--gold);cursor:pointer;font:inherit;font-weight:600;padding:0}
.msg{margin-top:14px;font-size:12.5px;padding:9px 11px;border-radius:5px;display:none}
.msg.show{display:block}
.msg.err{background:#f4dede;color:var(--danger)}
:root[data-theme="dark"] .msg.err{background:#3a1a1a}
.msg.ok{background:var(--gold-soft);color:#4a3a10}
:root[data-theme="dark"] .msg.ok{color:#e7d6ab}

#app-view{min-height:100vh;display:flex}
.sidebar{width:262px;flex:0 0 auto;background:var(--navy);color:#e9e4d6;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{display:flex;gap:10px;align-items:center;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.14)}
.sidebar .brand h2{font-size:14.5px;line-height:1.3}
.sidebar .brand span{display:block;font-size:11px;color:#b7ac86;margin-top:2px}
.cat-btn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:#d8d2bd;font:inherit;font-size:13.5px;padding:9px 10px;border-radius:5px;cursor:pointer;margin-bottom:2px;transition:background .12s}
.cat-btn:hover{background:rgba(255,255,255,.07)}
.cat-btn.active{background:var(--gold);color:#221a05;font-weight:600}
.cat-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:currentColor;opacity:.55}
.sidebar-foot{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.who{font-size:12px;color:#b7ac86;margin-bottom:10px;line-height:1.5}
.who strong{color:#f3efe1}

.main{flex:1;min-width:0;padding:36px 44px 60px;max-width:920px}
.main .kicker{font-size:12px;letter-spacing:.02em;color:var(--gold);font-weight:600;margin-bottom:6px}
.main h1{font-size:26px;margin-bottom:6px}
.main .sub{color:var(--muted);font-size:14px;margin:0 0 26px;max-width:62ch;line-height:1.6}
.section{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.knowledge{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:26px 28px;margin-bottom:24px}
.knowledge h4{font-size:15px;margin:20px 0 8px;color:var(--navy-2)}
:root[data-theme="dark"] .knowledge h4{color:var(--gold-soft)}
.knowledge h4:first-child{margin-top:0}
.knowledge p{font-size:14.5px;line-height:1.75;margin:0 0 4px;max-width:70ch}
.knowledge ul{margin:6px 0 4px;padding-left:20px}
.knowledge li{font-size:14.5px;line-height:1.7;margin-bottom:4px;max-width:66ch}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tag{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;background:var(--gold-soft);color:#4a3a10}
:root[data-theme="dark"] .tag{color:var(--gold-soft);background:rgba(182,137,47,.18)}

.section-label{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}

.resource{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:18px 20px;margin-bottom:12px}
.resource h3{font-size:15.5px;margin-bottom:5px}
.resource .meta{font-size:11px;color:var(--muted);margin-bottom:9px}
.resource .body{font-size:14px;line-height:1.7;white-space:pre-wrap}
.empty{color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:6px;padding:20px;text-align:center}
.add-box{background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:18px 20px;margin-bottom:18px}
.add-box h3{font-size:14.5px;margin-bottom:12px}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--cream);color:var(--ink);font:inherit;font-size:14px;min-height:90px;resize:vertical}

@media (max-width:760px){
  #app-view{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static}
  .main{padding:24px 20px 50px}
}
</style>
</head>
<body>

<div id="auth-view">
  <div class="auth-card">
    <div class="auth-head">
      <div class="seal">IPR</div>
      <div><h1>IPR Cell</h1><p>Career Point University, Kota</p></div>
    </div>
    <div id="login-form">
      <label for="li-email">Email</label>
      <input id="li-email" type="email" autocomplete="email" placeholder="you@cpu.ac.in">

      <label for="su-name">Full name</label>

      <label for="su-email">Email</label>
      <input id="su-email" type="email" autocomplete="email" placeholder="you@cpu.ac.in">
      <label for="su-pass">Password</label>
      <input id="su-pass" type="password" autocomplete="new-password" placeholder="At least 6 characters">
      <button class="btn gold" id="signup-btn">Create account</button>
      <div class="switch-row">Already registered? <button id="show-login">Sign in</button></div>
    </div>
    <div class="msg" id="auth-msg"></div>

</div>

<div id="app-view" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="seal">IPR</div>
      <div><h2>IPR Cell</h2><span>Career Point University, Kota</span></div>
    </div>
    <nav id="cat-nav"></nav>
    <div class="sidebar-foot">
      <div class="who" id="who-box"></div>
      <button class="btn ghost" id="logout-btn" style="margin-top:0">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <p class="kicker">KNOWLEDGE BASE</p>
    <h1 id="cat-title">Overview</h1>
    <p class="sub" id="cat-sub"></p>
    <div class="section" id="section-root"></div>

</div>

<script>

const SUPABASE_URL = "https://hcgkfzojgrnabkgrruhs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_limfkr_mETSrLlKOvCv8Yw_Tjb5f8st";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORIES = [
  { key:"overview", label:"Overview", tags:[],
    desc:"What the IPR Cell does and how it helps you protect original work.",
    html:`<h4>Why an IPR Cell</h4>
    <p>Career Point University's IPR Cell exists so that a good idea — a working prototype, a piece of software, a novel process, a brand you've built — doesn't stay unprotected by accident. Most students and faculty lose rights not because their work isn't protectable, but because no one told them protection was time-sensitive and procedural.</p>
    <h4>What the Cell does</h4>
    <ul>
      <li>Runs a first screening on any disclosed invention, design, brand or written work to identify which IP route fits.</li>
      <li>Guides drafting and filing with the Indian Patent Office, Trade Marks Registry or Copyright Office.</li>
      <li>Maintains the university's IPR policy, ownership rules and revenue-sharing terms for inventors.</li>
      <li>Runs awareness sessions and maintains this knowledge base as a first stop before any filing.</li>
    </ul>
    <h4>Where to start</h4>
    <p>Pick the category on the left that matches what you've made. Each page covers what's protectable, who can apply, how long protection lasts, and the exact steps to take at CPU. Cell members can also publish specific guidance, contacts and forms into any category below the core knowledge.</p>`
  },
  { key:"patents", label:"Patents", tags:["Duration: 20 years","Route: Patent Office, India"],
    desc:"Protecting new inventions — products, processes and technical improvements.",
    html:`<h4>What it protects</h4>
    <p>A patent protects a new invention that is novel, involves an inventive step, and is capable of industrial application — a device, a method, a chemical composition, an algorithm implemented in a technical system. It does not protect a bare idea; it protects a specific, working solution to a technical problem.</p>
    <h4>Who can apply</h4>
    <ul>
      <li>Any student, researcher or faculty member who has genuinely contributed to conceiving or reducing the invention to practice.</li>
      <li>Joint inventors are all named; ownership and any revenue share follow CPU's IPR policy where university resources were used.</li>
    </ul>
    <h4>How long it lasts</h4>
    <p>20 years from the filing date, provided renewal fees are paid, after which the invention enters the public domain.</p>
    <h4>Process at CPU</h4>
    <ul>
      <li>Submit an invention disclosure to the IPR Cell before you publish, present or demo the work publicly — public disclosure before filing can destroy novelty.</li>
      <li>The Cell runs a prior-art search and a patentability screening.</li>
      <li>If viable, a patent agent drafts the specification and claims; a provisional application can be filed quickly, followed by a complete specification within 12 months.</li>
      <li>Examination is requested separately and can take 2–5 years depending on the field.</li>
    </ul>
    <h4>Common mistakes</h4>
    <p>Publishing a paper or posting a demo video before filing; assuming a software idea alone (without a technical implementation) is patentable; delaying disclosure until after a competition or expo.</p>`
  },
  { key:"trademarks", label:"Trademarks", tags:["Duration: 10 years, renewable","Route: Trade Marks Registry"],
    desc:"Protecting names, logos, taglines and other brand identifiers.",
    html:`<h4>What it protects</h4>
    <p>A trademark protects any sign capable of distinguishing goods or services — a word mark, logo, tagline, or in some cases a sound or distinctive packaging. It protects brand identity, not the product or invention behind it.</p>
    <h4>Who can apply</h4>
    <ul>
      <li>Student startups, incubated ventures, and university-run initiatives that trade under a distinct name or mark.</li>
      <li>The mark must actually be used, or genuinely intended for use, in connection with specific goods or services.</li>
    </ul>
    <h4>How long it lasts</h4>
    <p>10 years from registration, renewable indefinitely in further 10-year terms as long as the mark stays in use.</p>
    <h4>Process at CPU</h4>
    <ul>
      <li>Run a clearance search first — a name confusingly similar to an existing registered mark in your class of goods/services will be refused or opposed.</li>
      <li>File under the correct class (the Nice Classification has 45 classes); the Cell can help identify the right one.</li>
      <li>Expect an examination report, possible objections to respond to, and a publication period during which others can oppose before registration is granted.</li>
    </ul>
    <h4>Common mistakes</h4>
    <p>Using ™ before filing and ® before actual registration; picking a purely descriptive name that's hard to register; skipping the clearance search and rebranding later after an objection.</p>`
  },
  { key:"copyrights", label:"Copyrights", tags:["Duration: Life + 60 years","Route: Automatic, registration optional"],
    desc:"Protecting original literary, artistic, musical and software works.",
    html:`<h4>What it protects</h4>
    <p>Copyright protects the original expression of an idea, not the idea itself — source code, research papers, project reports, illustrations, music, photographs, videos and databases. Two people can independently write similar code from the same idea and each hold copyright in their own expression.</p>
    <h4>Who can apply</h4>
    <ul>
      <li>Copyright arises automatically the moment an original work is fixed in a tangible or digital form — no filing is required to hold the right.</li>
      <li>Registration with the Copyright Office is optional but strengthens your position as evidence of ownership in any dispute.</li>
    </ul>
    <h4>How long it lasts</h4>
    <p>Generally the author's lifetime plus 60 years for literary, dramatic, musical and artistic works; software is treated as a literary work under Indian law.</p>
    <h4>Process at CPU</h4>
    <ul>
      <li>Keep dated records — commit history, drafts, timestamps — as your first line of proof of authorship.</li>
      <li>For work created as part of university-funded research or a sponsored project, check the applicable assignment terms before assuming personal ownership.</li>
      <li>The Cell can assist with formal registration for software and written works where you want a public, certified record.</li>
    </ul>
    <h4>Common mistakes</h4>
    <p>Assuming code pushed to a public repository loses protection — it doesn't, but an open-source license you attach does grant others rights; forgetting to clear rights when reusing others' images, music or datasets in your own project.</p>`
  },
  { key:"designs", label:"Industrial Designs", tags:["Duration: 10 + 5 years","Route: Design Office"],
    desc:"Protecting the visual appearance of a functional product.",
    html:`<h4>What it protects</h4>
    <p>A design registration protects the shape, configuration, pattern or ornamentation applied to a functional article — how a product looks, not how it works. A new casing shape for a device, a distinctive product silhouette, or a surface pattern can qualify.</p>
    <h4>Who can apply</h4>
    <p>Anyone who has created a new and original design for an article that will be produced by an industrial process, provided the design hasn't already been published or disclosed anywhere.</p>
    <h4>How long it lasts</h4>
    <p>10 years from registration, extendable once by a further 5 years.</p>
    <h4>Process at CPU</h4>
    <ul>
      <li>File before you showcase the product publicly — like patents, prior disclosure can bar registration.</li>
      <li>Prepare clear representations (multiple views) of the design; the application is examined mainly on novelty of appearance, not function.</li>
      <li>Where a product has both a novel mechanism and a novel look, the Cell can help you assess whether you need a patent, a design registration, or both.</li>
    </ul>`
  },
  { key:"trade_secrets", label:"Trade Secrets", tags:["Duration: Indefinite, while secret","Route: Contractual, not registered"],
    desc:"Protecting confidential formulas, methods and business information.",
    html:`<h4>What it protects</h4>
    <p>A trade secret protects information that has commercial value because it isn't publicly known — an algorithm's internal tuning, a manufacturing process, a dataset, supplier terms, or research findings not yet published. Unlike patents, there is no registry; protection comes purely from keeping the information confidential.</p>
    <h4>Who can apply</h4>
    <p>Anyone handling confidential research or business information. Protection isn't "applied for" — it's maintained through practice: access controls, confidentiality agreements, and clear internal labelling of what's secret.</p>
    <h4>How long it lasts</h4>
    <p>Indefinitely, for as long as the information stays genuinely secret and reasonable steps are taken to protect it — it ends the moment the information becomes public, by any means.</p>
    <h4>Process at CPU</h4>
    <ul>
      <li>Use a non-disclosure agreement before sharing unpublished research or a working prototype with an external party, sponsor or potential collaborator.</li>
      <li>Decide early whether a piece of work is better protected as a patent (public disclosure, time-limited monopoly) or a trade secret (private, potentially indefinite) — the Cell can help weigh this trade-off.</li>
    </ul>`
  },
  { key:"gi", label:"Geographical Indications", tags:["Duration: 10 years, renewable","Route: GI Registry"],
    desc:"Protecting products whose qualities are tied to a place of origin.",
    html:`<h4>What it protects</h4>
    <p>A Geographical Indication identifies a product as originating from a specific place, where a given quality, reputation or characteristic is essentially attributable to that origin — think regional handicrafts, agricultural produce, or textiles tied to Rajasthan's traditions.</p>
    <h4>Who can apply</h4>
    <p>Registration is typically sought by an association, producer group or authority representing the producers of that good — not usually by an individual student project, though research documenting or supporting a GI claim is valuable applied work.</p>
    <h4>How long it lasts</h4>
    <p>10 years from registration, renewable indefinitely in further 10-year terms.</p>
    <h4>Relevance at CPU</h4>
    <p>Students researching Rajasthan's traditional crafts, textiles or agri-produce, or working with local producer communities, can consult the Cell on how GI protection works and how academic research can support a registration effort.</p>`
  },
  { key:"policy", label:"IPR Policy & Forms", tags:["Reference"],
    desc:"University IPR policy, ownership rules, disclosure forms and contacts.",
    html:`<h4>Ownership at a glance</h4>
    <ul>
      <li>IP created substantially using university resources, funding or facilities is generally governed by CPU's IPR policy on shared ownership and revenue distribution.</li>
      <li>IP created independently, outside university resources and coursework, generally remains with the creator — when in doubt, ask before you assume.</li>
      <li>Sponsored and collaborative projects follow the specific terms of the sponsorship or collaboration agreement, which can override the general policy.</li>
    </ul>
    <h4>Before you disclose publicly</h4>
    <p>Talk to the Cell before a conference presentation, publication, competition demo or public launch if you think the underlying work might be patentable or design-registrable. This is the single most common way inventors accidentally forfeit their own rights.</p>
    <h4>Getting in touch</h4>
    <p>Cell administrators can publish updated contact details, office hours and downloadable disclosure forms directly into this section — check back here for the latest version rather than relying on an old printout.</p>`
  }
];

let currentUser = null, currentProfile = null, currentCat = "overview";
const $ = (id) => document.getElementById(id);
function showMsg(text, ok){ const m=$("auth-msg"); m.textContent=text; m.className="msg show "+(ok?"ok":"err"); }

$("show-signup").onclick = () => { $("login-form").classList.add("hidden"); $("signup-form").classList.remove("hidden"); $("auth-msg").className="msg"; };
$("show-login").onclick = () => { $("signup-form").classList.add("hidden"); $("login-form").classList.remove("hidden"); $("auth-msg").className="msg"; };

$("login-btn").onclick = async () => {
  const email=$("li-email").value.trim(), password=$("li-pass").value;
  if(!email||!password) return showMsg("Enter your email and password.", false);
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) showMsg(error.message, false); else showMsg("Signed in.", true);
};
$("signup-btn").onclick = async () => {
  const full_name=$("su-name").value.trim(), email=$("su-email").value.trim(), password=$("su-pass").value;
  if(!full_name||!email||!password) return showMsg("Fill in every field.", false);
  if(password.length<6) return showMsg("Password must be at least 6 characters.", false);
  const { error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name } } });
  if(error) return showMsg(error.message, false);
  showMsg("Account created. Check your email to confirm, then sign in.", true);
};
$("logout-btn").onclick = async () => { await sb.auth.signOut(); };

async function loadProfile(user){
  let { data, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(!data && !error?.message?.includes("permission")){
    const ins = await sb.from("profiles").insert({ id:user.id, full_name:user.user_metadata?.full_name||user.email, role:"member" }).select().single();
    data = ins.data;
  }
  return data || { full_name:user.email, role:"member" };
}

function renderNav(){
  const nav = $("cat-nav"); nav.innerHTML = "";
  CATEGORIES.forEach(c => {
    const b = document.createElement("button");
    b.className = "cat-btn" + (c.key===currentCat ? " active" : "");
    b.innerHTML = `<span class="cat-dot"></span><span>${c.label}</span>`;
    b.onclick = () => { currentCat=c.key; renderNav(); loadCategory(); };
    nav.appendChild(b);
  });
}

async function loadCategory(){
  const cat = CATEGORIES.find(c=>c.key===currentCat);
  $("cat-title").textContent = cat.label;
  $("cat-sub").textContent = cat.desc;
  const root = $("section-root");
  root.classList.remove("section"); void root.offsetWidth; root.classList.add("section");

  let addBox = "";
  if(currentProfile.role === "admin"){
    addBox = `<div class="add-box">
      <h3>Add cell guidance to ${cat.label}</h3>
      <input id="new-title" type="text" placeholder="Title" style="margin-bottom:10px">
      <textarea id="new-body" placeholder="Guidance, contacts, forms, deadlines…"></textarea>
      <button class="btn gold" id="save-res" style="max-width:220px">Publish</button>
    </div>`;
  }

  root.innerHTML = `
    <div class="knowledge">${cat.html}${cat.tags.length? `<div class="tag-row">${cat.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`:""}</div>
    ${addBox}
    <p class="section-label">Cell-published resources</p>
    <div id="resource-list"><p class="empty">Loading…</p></div>`;

  if(currentProfile.role === "admin"){
    $("save-res").onclick = async () => {
      const title=$("new-title").value.trim(), content=$("new-body").value.trim();
      if(!title||!content) return;
      const { error } = await sb.from("resources").insert({ category:cat.key, title, content, created_by:currentUser.id });
      if(!error) loadCategory();
    };
  }

  const list = $("resource-list");
  const { data, error } = await sb.from("resources").select("*").eq("category", cat.key).order("created_at", { ascending:false });
  if(error){ list.innerHTML = `<p class="empty">Resources will appear here once connected to Supabase.</p>`; return; }
  if(!data || data.length===0){ list.innerHTML = "<p class='empty'>No cell-specific updates published yet — the guidance above still applies.</p>"; return; }
  list.innerHTML = "";
  data.forEach(r => {
    const el = document.createElement("div"); el.className = "resource";
    const date = new Date(r.created_at).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    el.innerHTML = `<h3></h3><div class="meta">Published ${date}</div><div class="body"></div>`;
    el.querySelector("h3").textContent = r.title;
    el.querySelector(".body").textContent = r.content;
    list.appendChild(el);
  });
}

sb.auth.onAuthStateChange(async (_event, session) => {
  if(session?.user){
    currentUser = session.user;
    currentProfile = await loadProfile(currentUser);
    $("auth-view").classList.add("hidden");
    $("app-view").classList.remove("hidden");
    $("who-box").innerHTML = `Signed in as<br><strong>${currentProfile.full_name}</strong><br>${currentProfile.role==="admin"?"Cell administrator":"Member"}`;
    currentCat = "overview"; renderNav(); loadCategory();
  } else {
    currentUser=null; currentProfile=null;
    $("app-view").classList.add("hidden");
    $("auth-view").classList.remove("hidden");
  }
});
</script>
</body>
</html>
